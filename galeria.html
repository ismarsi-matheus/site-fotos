<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Galeria da festa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css">
<style>
  main { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem 2rem; }
  h1 { font-family: var(--fonte-titulo); font-weight: 400; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1; margin: 0; }
  #contagem { margin: .4rem 0 0; color: var(--suave); }
  .acoes { display: flex; flex-wrap: wrap; gap: .6rem; }
  #progresso { margin: .8rem 0 0; color: var(--suave); font-weight: 600; min-height: 1.5em; }

  .mural { margin-top: 1.5rem; columns: 2 10rem; column-gap: 1rem; }
  .mural .quadro { break-inside: avoid; margin-bottom: 1rem; cursor: zoom-in; display: block; width: 100%;
                   border: 0; text-align: left; font: inherit; }
  .mural .quadro:nth-child(3n) { transform: rotate(-1deg); }
  .mural .quadro:nth-child(3n + 1) { transform: rotate(.8deg); }
  @media (min-width: 700px) { .mural { columns: 3 14rem; column-gap: 1.4rem; } }

  .vazio { text-align: center; padding: 4rem 1rem; color: var(--suave); }
  .vazio strong { display: block; font-family: var(--fonte-titulo); font-weight: 400; font-size: 1.6rem; color: var(--tinta); }

  dialog {
    border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh;
    width: 100%; height: 100%; color: #fff;
  }
  dialog::backdrop { background: rgba(20, 10, 23, .92); }
  .caixa { height: 100%; display: grid; grid-template-rows: 1fr auto; padding: 1rem; padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
  .caixa img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; min-height: 0; }
  .barra { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: center; padding-top: .8rem; }
  .barra p { flex-basis: 100%; text-align: center; margin: 0 0 .3rem; font-family: var(--fonte-titulo); font-size: 1.1rem; }
  .barra .botao.secundario { color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
</style>
</head>
<body>
<main>
  <nav class="abas" aria-label="Páginas">
    <a href="index.html">Enviar fotos</a>
    <a href="galeria.html" aria-current="page">Álbum da festa</a>
  </nav>

  <header>
    <div>
      <h1 id="titulo"></h1>
      <p id="contagem">Carregando fotos…</p>
    </div>
    <div class="acoes">
      <button class="botao secundario" id="baixar-todas" disabled>Baixar todas (.zip)</button>
    </div>
  </header>
  <p id="progresso" aria-live="polite"></p>

  <div class="mural" id="mural"></div>
  <div class="vazio" id="vazio" hidden>
    <strong>Nenhuma foto ainda</strong>
    Quando os convidados enviarem, elas aparecem aqui sozinhas.
  </div>
  <p class="aviso-demo" id="aviso-demo" hidden>Modo demonstração: mostrando só as fotos enviadas neste navegador.</p>
  <p class="organizacao">Organização: <a href="telao.html">Abrir telão</a> · <a href="qrcode.html">Imprimir QR code</a></p>
</main>

<dialog id="ampliada" aria-label="Foto ampliada">
  <div class="caixa">
    <img id="img-ampliada" alt="">
    <div class="barra">
      <p id="legenda-ampliada"></p>
      <button class="botao secundario" id="anterior">Anterior</button>
      <button class="botao secundario" id="proxima">Próxima</button>
      <button class="botao" id="baixar-uma">Baixar foto</button>
      <button class="botao secundario" id="fechar">Fechar</button>
    </div>
  </div>
</dialog>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="fotos.js"></script>
<script>
  const cfg = window.EVENTO;
  document.title = 'Galeria: ' + cfg.titulo;
  document.getElementById('titulo').textContent = cfg.titulo;
  if (Fotos.modo === 'demo') document.getElementById('aviso-demo').hidden = false;

  const mural = document.getElementById('mural');
  const vazio = document.getElementById('vazio');
  const contagem = document.getElementById('contagem');
  const btnZip = document.getElementById('baixar-todas');
  const progresso = document.getElementById('progresso');
  const dialogo = document.getElementById('ampliada');
  const elementos = new Map();
  let fotos = [], atual = 0;

  async function atualizar() {
    try {
      fotos = await Fotos.listar();
    } catch (erro) {
      contagem.textContent = 'Não foi possível carregar as fotos. Tentando de novo em instantes.';
      return;
    }
    contagem.textContent = fotos.length === 1 ? '1 foto' : `${fotos.length} fotos`;
    vazio.hidden = fotos.length > 0;
    btnZip.disabled = fotos.length === 0;

    fotos.forEach((foto, i) => {
      let el = elementos.get(foto.id);
      if (!el) {
        el = document.createElement('figure');
        el.className = 'quadro';
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        const img = document.createElement('img');
        // Miniatura no mural; a foto inteira só é baixada ao ampliar. Se faltar a miniatura, usa a foto.
        img.onerror = () => { img.onerror = null; img.src = foto.url; };
        img.src = foto.miniatura || foto.url;
        img.alt = foto.autor ? `Foto enviada por ${foto.autor}` : 'Foto da festa';
        img.loading = 'lazy';
        const cap = document.createElement('figcaption');
        cap.innerHTML = `<span></span><small></small>`;
        cap.querySelector('span').textContent = foto.autor || ' ';
        el.append(img, cap);
        el.addEventListener('click', () => abrir(fotos.findIndex(f => f.id === foto.id)));
        el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); } });
        elementos.set(foto.id, el);
      }
      el.querySelector('small').textContent = Fotos.tempoRelativo(foto.criadaEm);
      mural.append(el); // mover um elemento existente não recarrega a imagem
    });
  }

  function abrir(i) {
    atual = i;
    const foto = fotos[i];
    document.getElementById('img-ampliada').src = foto.url;
    document.getElementById('legenda-ampliada').textContent = foto.autor ? `Enviada por ${foto.autor}` : '';
    if (!dialogo.open) dialogo.showModal();
  }
  document.getElementById('anterior').onclick = () => abrir((atual - 1 + fotos.length) % fotos.length);
  document.getElementById('proxima').onclick = () => abrir((atual + 1) % fotos.length);
  document.getElementById('fechar').onclick = () => dialogo.close();
  dialogo.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') document.getElementById('anterior').click();
    if (e.key === 'ArrowRight') document.getElementById('proxima').click();
  });

  // Downloads sempre pegam o ORIGINAL, na qualidade em que saiu do celular.
  async function baixarOriginal(foto) {
    const resp = await fetch(foto.original);
    if (!resp.ok) throw new Error('Falha ao baixar');
    return resp.blob();
  }

  const EXTENSOES = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/heic': 'heic', 'image/heif': 'heif', 'image/webp': 'webp' };
  function nomeArquivo(foto, i, tipo) {
    const autor = (foto.autor || 'convidado').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
    return `${cfg.slug}-${String(i + 1).padStart(3, '0')}-${autor}.${EXTENSOES[tipo] || 'jpg'}`;
  }

  async function salvar(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  document.getElementById('baixar-uma').onclick = async () => {
    const foto = fotos[atual];
    const blob = await baixarOriginal(foto);
    salvar(blob, nomeArquivo(foto, fotos.length - 1 - atual, blob.type));
  };

  btnZip.onclick = async () => {
    if (!window.JSZip) { progresso.textContent = 'Não foi possível carregar a ferramenta de download. Verifique a internet.'; return; }
    btnZip.disabled = true;
    const zip = new JSZip();
    const ordem = [...fotos].reverse(); // da primeira para a última
    let falhas = 0;
    for (let i = 0; i < ordem.length; i++) {
      progresso.textContent = `Juntando foto ${i + 1} de ${ordem.length}…`;
      try {
        const blob = await baixarOriginal(ordem[i]);
        zip.file(nomeArquivo(ordem[i], i, blob.type), blob);
      } catch (_) { falhas++; }
    }
    progresso.textContent = 'Criando o arquivo .zip…';
    const arquivo = await zip.generateAsync({ type: 'blob', compression: 'STORE' }); // as fotos já vêm comprimidas
    salvar(arquivo, `fotos-${cfg.slug}.zip`);
    progresso.textContent = falhas ? `Pronto. ${falhas} foto(s) não puderam ser baixadas.` : 'Pronto. O download começou.';
    btnZip.disabled = false;
  };

  atualizar();
  Fotos.aoMudar(atualizar, cfg.galeriaBuscaFotosACada);
</script>
</body>
</html>
